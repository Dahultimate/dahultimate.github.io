<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DahultiApp</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            /* Reprend l'identité violette du site vitrine (style.css : #9b5cf3 / #a56dff / #b67cff). */
            --color-primary: #7c3aed;
            --color-primary-dark: #6d28d9;
            --color-primary-light: #f2ebfe;
            --color-accent: #ec4899;

            --color-bg: #f7f6fb;
            --color-surface: #ffffff;
            --color-text: #1f2937;
            --color-text-muted: #6b7280;
            --color-border: #e6e3f1;

            --color-success: #16a34a;
            --color-success-bg: #dcfce7;
            --color-danger: #dc2626;
            --color-danger-bg: #fee2e2;
            --color-warning: #d97706;
            --color-warning-bg: #fef3c7;
            --color-info-bg: #e0e7ff;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --shadow-sm: 0 1px 2px rgba(31, 23, 61, 0.06);
            --shadow-md: 0 6px 20px rgba(31, 23, 61, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
        }
    </style>
</head>
<body>
    <dahultiapp-root></dahultiapp-root>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
